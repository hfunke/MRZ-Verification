[package]
name = "mrz_verifier"
version = "0.2.1"
edition = "2021"
description = "A Rust library for validating the Machine Readable Zone (MRZ) of electronic Machine Readable Travel Documents (eMRTDs) as specified by ICAO Doc 9303."
license = "MIT"
repository = "https://github.com/hfunke/MRZ-Verification"
keywords = ["MRZ", "eMRTD", "ICAO", "Doc 9303", "ePassport"]
categories = ["parser-implementations", "command-line-utilities", "encoding"]


[lib]
crate-type = ["cdylib"]

[dependencies]
phf = { version = "0.14.0", features = ["macros"] }
regex = "1.13.1"
chrono = "0.4.45"